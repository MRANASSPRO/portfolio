about:
  title: About Me
  paragraphs:
    - >-
      As a Senior Mobile Developer, I'm driven by building robust, high-performance
      Android applications. Across 5+ years I've led and contributed to multiple
      production projects, consistently taking ownership of architectural decisions and
      applying clean architecture and clean code principles to deliver scalable,
      maintainable mobile solutions.
    - >-
      My journey started with Java and J2EE backend work before I moved fully into
      Android, where I've shipped everything from a cloud-connected offline-first POS
      system with integrated payments, to AR-powered interior design apps with BLE color
      sensors, to a large-scale B2B e-commerce platform. Along the way I picked up
      Flutter for cross-platform delivery, and I'm now working with Kotlin Multiplatform
      to share business logic across targets.
    - >-
      My interests go well beyond the mobile client. I build APIs with Java, Spring Boot,
      Ktor and ASP.NET Core, design GraphQL schemas, and I'm deepening my AWS Cloud and
      CI/CD expertise across GitHub Actions, Azure Pipelines and Bitrise. I genuinely
      enjoy owning a feature end-to-end, from the Compose UI down to the service and
      pipeline that ships it.
  location: Mönchengladbach, Germany
  email: mranass.deu@gmail.com
  availability: Full-time, Hybrid or Remote

experience:
  title: Work Experience
  items:
    - position: Senior Android Developer / C# Developer
      company: GastroSoft GmbH — Krefeld, Germany
      date: Jan 2025 - Jan 2026
      achievements:
        - Led the full development lifecycle of a modern cloud-connected mobile POS solution for Android.
        - Designed an offline-first architecture with automated database backups, keeping the app fully operational without connectivity.
        - Integrated payment processing and thermal receipt printing into the point-of-sale flow.
        - Implemented C# APIs using ASP.NET Core and EF Core to serve the mobile frontends.
        - Designed GraphQL schemas with HotChocolate and optimized database design.
      tech: Kotlin, Jetpack Compose, MVVM, Room, Coroutines, Dagger Hilt, Firebase, Crashlytics, Git, Azure Pipelines, C#, ASP.NET Core, EF Core, GraphQL
    - position: Android Developer
      company: Veeuze GmbH — Hybrid / Wesel, Germany
      date: Mar 2022 - Sep 2024
      achievements:
        - Architected and maintained specialized Android applications for the interior design domain.
        - Migrated old codebases gradually to Kotlin with Jetpack Compose, instead of Java and XML-based views.
        - Leveraged ARCore and 3D visualization to let users preview designs in their own space.
        - Integrated multiple BLE-based color sensor devices, enabling real-time color scanning of walls and objects.
        - Leveraged Google Maps API for location-based features in some customer apps.
        - Implemented UI and unit tests to raise and protect codebase quality.
        - Integrated user tracking solutions for better user management.
        - Implemented Firebase services and Crashlytics for app analytics and crash reporting
      tech: Java, Kotlin, MVVM, Jetpack Compose, Bluetooth BLE, REST APIs, Retrofit, ARCore, 3D/AR, Navigation Component, Coroutines, Gradle, Espresso/JUnit, Git
    - position: Android Developer
      company: Chari.ma — Tanger, Morocco
      date: Oct 2020 - Dec 2021
      achievements:
        - Developed and fully redesigned a large-scale B2B e-commerce app for consumer goods.
        - Built a dynamic product catalog and a configurable offers banner system.
        - Built a customized delivery tracking application with Google Maps API integration for real-time driver navigation.
        - Implemented package management and administrative monitoring dashboards.
      tech: Java, Kotlin, MVP, MVVM, Retrofit, Google Maps, REST APIs, Flutter, Git
    - position: Junior Java J2EE Developer
      company: VirtuoCode — Remote / Tanger, Morocco
      date: Feb 2020 - Jul 2020
      achievements:
        - Developed a SaaS platform for business model evaluation and strategic support for startups.
        - Built features for managing and tracking advertising campaigns.
      tech: Java, Spring Boot, MVC, Hibernate, MongoDB, Docker, JavaScript

