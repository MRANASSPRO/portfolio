projects:
  title: Projects
  items:
    - title: CryptoBlink
      description: >-
        An Android app for exploring the crypto market: browse top coins by rank, track
        live crypto prices, and open any coin for its project description, category tags and
        the team members behind it. Built on Clean Architecture with a Jetpack Compose UI
        over the CoinPaprika API.
      image:
        src: /projects/placeholder.svg
        alt: CryptoBlink Android app
      tags:
        - Kotlin
        - Jetpack Compose
        - Clean Architecture
        - MVVM
        - Hilt
        - Retrofit
        - REST API
      links:
        - label: GitHub
          icon: i-simple-icons-github
          to: https://github.com/MRANASSPRO/CryptoBlink
          target: _blank
    - title: JWT Auth API with Ktor
      description: >-
        A secure REST API demonstrating a full JWT authentication flow in Ktor: user
        registration, login issuing HMAC256-signed tokens with a one-hour expiry, and
        protected routes that verify each token's signature, issuer and audience
        automatically.
      image:
        src: /projects/placeholder.svg
        alt: JWT authentication REST API built with Ktor
      tags:
        - Kotlin
        - Ktor
        - JWT
        - REST API
        - Kotlinx Serialization
        - Java 21
      links:
        - label: GitHub
          icon: i-simple-icons-github
          to: https://github.com/MRANASSPRO/Jwt-Ktor
          target: _blank
    - title: E-Commerce Demo — Kotlin Multiplatform
      description: >-
        A production-ready Kotlin Multiplatform sample sharing both business logic and UI
        across Android, iOS and Web. Product list and detail screens are rendered with
        Compose Multiplatform and driven by an MVI state pattern, with Ktor handling the
        REST API and Koin providing dependency injection.
      image:
        src: /projects/placeholder.svg
        alt: Kotlin Multiplatform e-commerce demo app
      tags:
        - Kotlin Multiplatform
        - Compose Multiplatform
        - MVI
        - Koin
        - Ktor
        - Coroutines / Flow
      links:
        - label: GitHub
          icon: i-simple-icons-github
          to: https://github.com/MRANASSPRO/EcommerceDemoKMP
          target: _blank
    - title: GitHub Users Search
      description: >-
        A Flutter app for exploring GitHub: search users with paginated results from the
        GitHub REST API, then open any profile to browse that developer's public
        repositories in a single tap.
      image:
        src: /projects/placeholder.svg
        alt: GitHub users search Flutter app
      tags:
        - Flutter
        - Dart
        - REST API
        - GitHub API
        - Pagination
      links:
        - label: GitHub
          icon: i-simple-icons-github
          to: https://github.com/MRANASSPRO/github_users_search
          target: _blank
    - title: Decentralised Survey dApp
      description: >-
        A decentralised web application for running surveys on the Ethereum blockchain,
        with results recorded immutably via smart contracts.
      image:
        src: /projects/placeholder.svg
        alt: Ethereum Survey dApp
      tags:
        - Solidity
        - Ethereum
        - Truffle
        - React
        - Web3.js
      links:
        - label: GitHub
          icon: i-simple-icons-github
          to: https://github.com/MRANASSPRO
          target: _blank
    - title: Smart Embedded Alarm System
      description: >-
