name: ci

# Runs on every branch push, and on pull requests targeting main.
# Vercel handles deployment separately — this workflow only checks quality.
on:
  push:
  pull_request:
    branches: [main]

# If you push twice quickly, cancel the older run instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Catches build-time failures here rather than at deploy time.
      # The build peaks around 3.5 GB, which exceeds Node's default heap limit
      # on a 7 GB runner, so raise it explicitly to avoid an OOM (exit 134).
      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
